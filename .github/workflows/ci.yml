name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: dist is committed and current
        run: git diff --exit-code -- dist agent/components.md || (echo "Run npm run build and node scripts/agent-docs.mjs, then commit." && exit 1)
