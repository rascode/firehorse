<!-- Firehorse docs page layout. scripts/site.mjs fills {{SLOTS}} from each site/pages/*.html file and {{> part}} from site/parts/. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#161616">
<!-- KC's live endpoint (POST {agent, message, history, page} → {reply}). Empty: KC answers from the index on the page. -->
<meta name="fh-kc-endpoint" content="">
<!-- The design system this page is built on: audits and agents read it to pick the right Index. -->
<meta name="design-system" content="firehorse@{{DS_VERSION}}">
<link rel="design-system" href="https://firehorse.dev/index.json">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Firehorse">
<meta property="og:image" content="https://firehorse.dev/img/og/firehorse.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Firehorse: components that fit wherever you put them.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://firehorse.dev/img/og/firehorse.png">
<link rel="canonical" href="{{URL}}">
{{JSONLD}}
<link rel="alternate" type="text/plain" title="LLM index" href="llms.txt">
<link rel="alternate" type="application/json" title="Design tokens" href="tokens.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300..900&family=Hanken+Grotesk:wght@300..700&family=Archivo:wght@300..700&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" as="image" href="/img/backdrop/firehorse-horse.webp?v=4" fetchpriority="high">
<script>/* Hero intro: hold the animation until the horse art is decoded, so it plays smoothly. */(()=>{const d=document.documentElement,go=()=>d.classList.add("fh-ready");d.classList.add("fh-js");const i=new Image();i.src="/img/backdrop/firehorse-horse.webp?v=4";(i.decode?i.decode():Promise.reject()).then(go,go);setTimeout(go,2000)})();</script>
<link rel="stylesheet" href="firehorse.css">
<link rel="stylesheet" href="themes/rascode.css">
<link rel="stylesheet" href="themes.css">
<script>/* ?theme=<name> / ?scheme=light|dark|auto in the URL wins and is remembered, so a link can open the site in a given look. */try{var q=new URLSearchParams(location.search),qt=q.get("theme"),qs=q.get("scheme");if(qt!==null&&/^[a-z0-9-]{0,40}$/.test(qt))localStorage.setItem("fh-theme",qt==="firehorse"?"":qt);if(qs&&/^(light|dark|auto)$/.test(qs))localStorage.setItem("fh-scheme",qs)}catch(e){}try{var t=localStorage.getItem("fh-theme");if(t!==null)t?document.documentElement.setAttribute("data-fh-theme",t):document.documentElement.removeAttribute("data-fh-theme")}catch(e){}/* Colour of the day: the golden angle times the day number, so consecutive days sit far apart on the wheel. */try{var D=document.documentElement,n=new Date(),k=Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5),hue=Math.round(k*137.508%360);D.style.setProperty("--site-day","oklch(0.68 0.19 "+hue+")");D.setAttribute("data-site-day","");}catch(e){}try{var r=localStorage.getItem("fh-root");if(r&&/^#[0-9a-f]{6}$/i.test(r)){document.documentElement.style.setProperty("--site-pick",r);document.documentElement.setAttribute("data-site-root","")}}catch(e){}</script>
<link rel="stylesheet" href="icons.css">
{{STYLES}}
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="fh-skip" href="#main">Skip to content</a>

<div class="fh-page">
{{HORSE}}
<!-- Hero backdrop: three horses in pencil on a blueprint sheet, facing right. Fixed behind the page; it frosts over once you scroll. -->
<div class="site-backdrop" aria-hidden="true">
  <div class="site-backdrop__art">
    <div class="site-backdrop__reveal">
      <div class="site-backdrop__horse"></div>
      <div class="site-backdrop__sweep"><div class="site-backdrop__glint"></div><div class="site-backdrop__glint site-backdrop__glint--b"></div></div>
    </div>
  </div>
  <div class="site-backdrop__frost"></div>
</div>

{{> header}}
  <main id="main" class="fh-main">
{{MAIN}}
  </main>

{{> footer}}
{{PANEL}}</div>

{{> lead}}

{{> cmdk}}

{{AFTER}}

<div class="fh-toaster" role="region" aria-label="Notifications" id="toaster"></div>

<script type="module" src="firehorse.js"></script>
<script src="attribution.js" defer></script>
<script src="site.js" defer></script>
<script type="module" src="site-features.js"></script>
<script type="module" src="site-index.js"></script>
{{SCRIPTS}}
</body>
</html>
